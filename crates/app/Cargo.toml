[package]
name = "blah"
description = "The GPUI frontend: a window onto the world."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
dirs = "5"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
blah-core = { path = "../core" }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Only for the frame type GPUI images are built from; the version GPUI itself uses.
image = { version = "0.25", default-features = false }

[lints]
workspace = true
