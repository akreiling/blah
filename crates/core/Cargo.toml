[package]
name = "blah-core"
description = "Pure game core: world generation, regions, genetics and evolution, and the rules of play."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Only the bestiary_sheet example writes images; the library itself never does I/O.
png = "0.18"
proptest = "1.12.0"
serde_json = "1"
