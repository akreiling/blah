    { path = "f32::log10", reason = "libm; not exact across platforms" },
    { path = "f32::powf", reason = "libm; not exact across platforms" },
    { path = "f32::powi", reason = "not guaranteed identical across platforms; multiply instead" },
    { path = "f32::sin", reason = "libm; not exact across platforms" },
    { path = "f32::cos", reason = "libm; not exact across platforms" },
    { path = "f32::sin_cos", reason = "libm; not exact across platforms" },
