# The simulation must give the same bits for the same seed on every platform, so it uses only floating-point
# operations IEEE 754 rounds exactly. These come from the platform's math library or its compiler intrinsics,
# whose results may differ in the last bit between platforms and Rust versions. Tests that compare against them
# allow `clippy::disallowed_methods` where they do.
disallowed-methods = [
    { path = "f32::exp", reason = "libm; not exact across platforms" },
    { path = "f32::exp2", reason = "libm; not exact across platforms" },
    { path = "f32::exp_m1", reason = "libm; not exact across platforms" },
    { path = "f32::ln", reason = "libm; not exact across platforms" },
    { path = "f32::ln_1p", reason = "libm; not exact across platforms" },
