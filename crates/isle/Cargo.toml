[package]
name = "isle"
description = "The Isle window: a two-character grid, a log, and a turn-based command line."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
dirs = "5"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
isle-core = { path = "../isle-core" }
blah-core = { path = "../core" }
# The frame type GPUI uses for in-memory sprite images.
image = { version = "0.25", default-features = false }
serde_json = "1"

[lints]
workspace = true
